<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BetBot MX">
  <title>BetBot MX</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="wallpaper"><i></i><i></i><i></i><i></i></div>

  <aside class="sidebar glass" id="sidebar"></aside>

  <div class="app">
    <header class="statusbar">
      <div class="titles">
        <h1 class="largetitle" id="page-title">Inicio</h1>
        <div class="subtitle" id="page-sub">BetBot MX · Simulación con banca ficticia</div>
      </div>
      <div class="top-actions">
        <span class="pill glass hide-sm" id="bot-pill" title="Estado del piloto automático"><span class="dot" id="bot-dot"></span><span id="bot-label">Bot en pausa</span></span>
        <span class="pill glass" id="bank-pill">$2,000.00 MXN</span>
        <button class="icon-btn glass" id="qr-btn" data-tab="more" data-more-tab="phone" title="Abrir en tu celular (código QR)" aria-label="Código QR para el celular" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
        </button>
        <button class="icon-btn glass" id="bell" title="Notificaciones" aria-label="Notificaciones">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="badge" id="bell-count" hidden></span>
        </button>
        <button class="pill glass" id="refresh-btn" title="Actualizar datos ahora">↻ <span id="last-update">—</span></button>
      </div>
    </header>

    <main id="view"></main>
  </div>

  <nav class="tabbar glass" id="tabbar"></nav>

  <button class="slip-fab" id="slip-fab" data-tab="bet" hidden>🎫 Boleto <span class="badge" id="slip-fab-count">0</span></button>

  <div class="sheet-backdrop" id="backdrop"></div>
  <section class="notif-panel glass" id="notif-panel" aria-label="Notificaciones"></section>
  <section class="sheet glass" id="sheet" aria-modal="true" role="dialog">
    <div class="grabber"></div>
    <div class="sheet-head"><div class="grow" id="sheet-title"></div><button class="close-x" data-close>✕</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="toasts" id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
